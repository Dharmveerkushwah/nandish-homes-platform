<header class="site-header" [class.site-header--scrolled]="scrolled()" [class.site-header--open]="menuOpen()">
  <a class="brand" routerLink="/" (click)="menuOpen.set(false)">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 40 40" width="34" height="34">
        <circle cx="20" cy="16" r="7" fill="#d9ab48" />
        <path d="M4 27c3-3 6-3 9 0s6 3 9 0 6-3 9 0 5 3 5 3" fill="none" stroke="#0c3b5c" stroke-width="2.4" stroke-linecap="round" />
        <path d="M2 33c3-3 6-3 9 0s6 3 9 0 6-3 9 0 6 3 9 0" fill="none" stroke="#0c3b5c" stroke-width="2" stroke-linecap="round" opacity=".55" />
      </svg>
    </span>
    <span class="brand-text">
      <span class="brand-name">NANDISH <b>HOMES</b></span>
      <span class="brand-tag">Stay in Serenity</span>
    </span>
  </a>

  <nav class="desktop-nav" aria-label="Primary">
    @for (link of navLinks; track link.label) {
      <a
        [href]="link.path"
        [class.is-active]="isActive(link)"
        (click)="navigate(link, $event)"
      >{{ link.label }}</a>
    }
  </nav>

  <div class="header-actions">
    <a class="admin-link" routerLink="/admin">Staff login</a>
    <a class="header-book" href="/#book" (click)="bookNow($event)">
      <nh-icon name="calendar" [size]="14" /> Book now
    </a>
  </div>

  <button class="menu-button" type="button" [attr.aria-expanded]="menuOpen()" aria-label="Toggle navigation" (click)="toggleMenu()">
    <nh-icon [name]="menuOpen() ? 'close' : 'menu'" [size]="22" />
  </button>

  <div class="mobile-nav" [class.mobile-nav--open]="menuOpen()">
    <nav aria-label="Mobile">
      @for (link of navLinks; track link.label) {
        <a [href]="link.path" [class.is-active]="isActive(link)" (click)="navigate(link, $event)">{{ link.label }}</a>
      }
    </nav>
    <div class="mobile-actions">
      <a class="admin-link" routerLink="/admin" (click)="menuOpen.set(false)">Staff login</a>
      <a class="header-book" href="/#book" (click)="bookNow($event)">
        <nh-icon name="calendar" [size]="14" /> Book now
      </a>
    </div>
  </div>
</header>
@if (menuOpen()) {
  <button class="mobile-nav-scrim" type="button" aria-label="Close navigation" (click)="menuOpen.set(false)"></button>
}
