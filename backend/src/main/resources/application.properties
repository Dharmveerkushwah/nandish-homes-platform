server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

spring.application.name=nandish-homes-api

spring.datasource.url=${ORACLE_JDBC_URL:jdbc:oracle:thin:@localhost:1521/XEPDB1}
spring.datasource.username=${ORACLE_DB_USERNAME:NANDISH_HOMES}
spring.datasource.password=${ORACLE_DB_PASSWORD:NANDISH_HOMES}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jackson.default-property-inclusion=non_null

management.endpoints.web.exposure.include=health,info

nandish.security.jwt-secret=${JWT_SECRET:NandishHomesLocalJwtSecretKey2026Secure}
nandish.security.access-token-minutes=60



 # ==========================================
# PAYMENT CONFIGURATION
# ==========================================

nandish.payment.bypass=true

nandish.payment.key-id=
nandish.payment.key-secret=

nandish.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:4200,http://localhost:5000}